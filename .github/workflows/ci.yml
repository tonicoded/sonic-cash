name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'

jobs:
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: contracts/package-lock.json
        
    - name: Install contract dependencies
      run: |
        cd contracts
        npm ci
        
    - name: Compile contracts
      run: |
        cd contracts
        npx hardhat compile
        
    - name: Run contract tests
      run: |
        cd contracts
        npx hardhat test
        
    - name: Generate gas report
      run: |
        cd contracts
        REPORT_GAS=true npx hardhat test
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: contract-artifacts
        path: contracts/artifacts/
        
  circuits:
    name: ZK Circuits
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Circom
      run: |
        wget https://github.com/iden3/circom/releases/download/v2.1.6/circom-linux-amd64
        chmod +x circom-linux-amd64
        sudo mv circom-linux-amd64 /usr/local/bin/circom
        
    - name: Install snarkjs
      run: npm install -g snarkjs
      
    - name: Compile circuits
      run: |
        cd circuits
        ./compile.sh
        
    - name: Upload circuit artifacts
      uses: actions/upload-artifact@v3
      with:
        name: circuit-artifacts
        path: circuits/build/
        
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Type check
      run: |
        cd frontend
        npm run type-check
        
    - name: Lint code
      run: |
        cd frontend
        npm run lint
        
    - name: Run tests
      run: |
        cd frontend
        npm run test
        
    - name: Build application
      run: |
        cd frontend
        npm run build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: frontend/.next/
        
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [contracts, circuits, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: npm run install:all
      
    - name: Run integration tests
      run: npm run test
      
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/develop'
    
    environment: testnet
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: npm run install:all
      
    - name: Deploy contracts to testnet
      env:
        PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
        SONIC_TESTNET_RPC: ${{ secrets.SONIC_TESTNET_RPC }}
      run: npm run contracts:deploy:testnet
      
    - name: Deploy frontend to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        cd frontend
        npx vercel --prod --token $VERCEL_TOKEN
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run npm audit
      run: |
        cd contracts && npm audit --audit-level moderate
        cd ../frontend && npm audit --audit-level moderate
        
    - name: Run Slither analysis
      uses: crytic/slither-action@v0.3.0
      with:
        target: contracts/
        slither-config: slither.config.json