<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Sonic Tornado - Privacy Pool</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0d1f 0%, #1a1d3a 50%, #0f1229 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(0, 150, 200, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #0066cc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .subtitle {
            color: #a0b3cc;
            font-size: 1.2rem;
            font-weight: 500;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 8px 24px rgba(0, 212, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 32px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            margin-bottom: 32px;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .status-value {
            color: #00d4ff;
            font-family: 'Inter', ui-monospace, SFMono-Regular, monospace;
            font-weight: 600;
        }

        .denomination-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .denomination-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .denomination-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .denomination-card.selected {
            border-color: rgba(0, 212, 255, 0.6);
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }

        .denomination-amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .denomination-info {
            color: #a0b3cc;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 32px;
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Inter', ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
            -webkit-border-radius: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.6);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 0 0 3px rgba(0, 212, 255, 0.15),
                0 8px 24px rgba(0, 212, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #0066cc 100%);
            color: white;
            border: none;
            padding: 20px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 32px rgba(0, 212, 255, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #00b8e6 0%, #0088ff 50%, #0055bb 100%);
            transform: translateY(-2px);
            box-shadow: 
                0 16px 48px rgba(0, 212, 255, 0.4),
                0 8px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #2a2d3a 0%, #21242f 100%);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .alert {
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1.5px solid;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00d4ff;
            border-right-color: #0099ff;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #a0b3cc;
            font-size: 13px;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 48px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
            }
            
            .header h1 {
                font-size: 2.8rem;
            }
            
            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }
            
            .denomination-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sonic Tornado</h1>
            <p class="subtitle">Advanced Privacy Pool Protocol</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="anonymitySet">-</div>
                <div class="stat-label">Anonymity Set</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalValueLocked">-</div>
                <div class="stat-label">TVL (S)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="relayerFee">0.3%</div>
                <div class="stat-label">Relayer Fee</div>
            </div>
        </div>

        <div class="card">
            <!-- Connection Status -->
            <div class="status" id="connectionStatus" style="display: none;">
                <span>Connected</span>
                <span class="status-value" id="walletAddress">Not connected</span>
            </div>

            <!-- Alerts -->
            <div id="alerts"></div>

            <!-- Denomination Selection -->
            <div class="form-group">
                <label>Select Denomination</label>
                <div class="denomination-grid">
                    <div class="denomination-card" data-denomination="0.1">
                        <div class="denomination-amount">0.1 S</div>
                        <div class="denomination-info">Small amount</div>
                    </div>
                    <div class="denomination-card" data-denomination="1">
                        <div class="denomination-amount">1 S</div>
                        <div class="denomination-info">Standard</div>
                    </div>
                    <div class="denomination-card" data-denomination="10">
                        <div class="denomination-amount">10 S</div>
                        <div class="denomination-info">Medium</div>
                    </div>
                    <div class="denomination-card" data-denomination="100">
                        <div class="denomination-amount">100 S</div>
                        <div class="denomination-info">Large amount</div>
                    </div>
                </div>
            </div>

            <!-- Recipient Address -->
            <div class="form-group">
                <label for="recipient">Recipient Address</label>
                <input 
                    type="text" 
                    id="recipient" 
                    placeholder="0x... (leave empty for deposit only)">
            </div>

            <!-- Action Buttons -->
            <button class="btn" id="depositBtn" onclick="deposit()" disabled>
                <span id="depositText">Select Denomination to Deposit</span>
            </button>

            <button class="btn" id="withdrawBtn" onclick="withdraw()">
                <span id="withdrawText">Withdraw from Pool</span>
            </button>

            <button class="btn btn-secondary" id="connectBtn" onclick="connectWallet()">
                Connect Wallet
            </button>
        </div>

        <div class="footer">
            Privacy-first protocol built for <a href="https://soniclabs.org" target="_blank">Sonic</a>
        </div>
    </div>

    <script>
        // Configuration
        const SONIC_TESTNET_CHAIN_ID = '0x3909'; // 14601
        const SONIC_TESTNET_RPC = 'https://rpc.testnet.soniclabs.com';
        const TORNADO_ADDRESS = '0x8B0Bc7243B3FF42812926023B4687Ca996b797d6';

        // Contract ABI
        const TORNADO_ABI = [
            {
                "inputs": [{"type": "bytes32", "name": "commitment"}],
                "name": "deposit",
                "outputs": [],
                "stateMutability": "payable",
                "type": "function"
            },
            {
                "inputs": [
                    {"type": "uint256", "name": "denomination"},
                    {"type": "bytes32", "name": "nullifier"},
                    {"type": "address", "name": "recipient"},
                    {"type": "address", "name": "relayer"},
                    {"type": "uint256", "name": "fee"},
                    {"type": "bytes32[]", "name": "merkleProof"}
                ],
                "name": "withdraw",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{"type": "uint256", "name": "denomination"}],
                "name": "getRoot",
                "outputs": [{"type": "bytes32", "name": ""}],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getAnonymitySetSize",
                "outputs": [{"type": "uint256", "name": ""}],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getTotalValueLocked",
                "outputs": [{"type": "uint256", "name": ""}],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "relayerFeePercent",
                "outputs": [{"type": "uint256", "name": ""}],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        let web3;
        let account;
        let selectedDenomination = null;
        let tornadoContract;

        // Initialize
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                web3 = new Web3(window.ethereum);
                tornadoContract = new web3.eth.Contract(TORNADO_ABI, TORNADO_ADDRESS);
                
                // Check if already connected
                const accounts = await web3.eth.getAccounts();
                if (accounts.length > 0) {
                    account = accounts[0];
                    updateConnectionStatus();
                }

                // Load stats
                await loadStats();

                // Listen for changes
                window.ethereum.on('accountsChanged', handleAccountsChanged);
                window.ethereum.on('chainChanged', () => window.location.reload());
                
                // Setup denomination selection
                setupDenominationSelection();
            } else {
                showAlert('error', 'MetaMask not detected. Please install MetaMask.');
            }
        });

        function setupDenominationSelection() {
            const cards = document.querySelectorAll('.denomination-card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove previous selection
                    cards.forEach(c => c.classList.remove('selected'));
                    
                    // Select this card
                    card.classList.add('selected');
                    selectedDenomination = parseFloat(card.dataset.denomination);
                    
                    // Update deposit button
                    const depositBtn = document.getElementById('depositBtn');
                    const depositText = document.getElementById('depositText');
                    
                    if (account) {
                        depositBtn.disabled = false;
                        depositText.textContent = `Deposit ${selectedDenomination} S to Pool`;
                    }
                });
            });
        }

        async function connectWallet() {
            if (!window.ethereum) {
                showAlert('error', 'MetaMask not installed');
                return;
            }

            try {
                // Request accounts
                const accounts = await window.ethereum.request({
                    method: 'eth_requestAccounts'
                });
                
                account = accounts[0];

                // Switch/add Sonic network
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: SONIC_TESTNET_CHAIN_ID }]
                    });
                } catch (error) {
                    if (error.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: SONIC_TESTNET_CHAIN_ID,
                                chainName: 'Sonic Testnet',
                                nativeCurrency: { name: 'Sonic', symbol: 'S', decimals: 18 },
                                rpcUrls: [SONIC_TESTNET_RPC],
                                blockExplorerUrls: ['https://testnet.sonicscan.org']
                            }]
                        });
                    }
                }

                updateConnectionStatus();
                showAlert('success', 'Wallet connected successfully');
                await loadStats();

            } catch (error) {
                console.error('Connection error:', error);
                showAlert('error', 'Failed to connect: ' + error.message);
            }
        }

        async function deposit() {
            if (!account) {
                showAlert('error', 'Please connect your wallet first');
                return;
            }

            if (!selectedDenomination) {
                showAlert('error', 'Please select a denomination');
                return;
            }

            const depositBtn = document.getElementById('depositBtn');
            const depositText = document.getElementById('depositText');
            
            try {
                depositBtn.disabled = true;
                depositText.innerHTML = '<div class="loading"></div>Generating commitment...';

                // Generate secret and commitment
                const secret = web3.utils.randomHex(32);
                const commitment = web3.utils.keccak256(secret);

                depositText.innerHTML = '<div class="loading"></div>Depositing to privacy pool...';

                // Deposit to contract
                const tx = await tornadoContract.methods.deposit(commitment).send({
                    from: account,
                    value: web3.utils.toWei(selectedDenomination.toString(), 'ether'),
                    gas: 300000
                });

                // Store deposit info
                const deposits = JSON.parse(localStorage.getItem('tornadoDeposits') || '[]');
                deposits.push({
                    secret,
                    commitment,
                    denomination: selectedDenomination,
                    txHash: tx.transactionHash,
                    timestamp: Date.now()
                });
                localStorage.setItem('tornadoDeposits', JSON.stringify(deposits));

                showAlert('success', `Deposit successful! ${selectedDenomination} S added to privacy pool. Secret saved for withdrawal.`);
                await loadStats();

            } catch (error) {
                console.error('Deposit failed:', error);
                
                let errorMsg = 'Deposit failed';
                if (error.code === 4001) {
                    errorMsg = 'Transaction cancelled';
                } else if (error.message?.includes('insufficient funds')) {
                    errorMsg = 'Insufficient funds';
                }
                
                showAlert('error', errorMsg);
            } finally {
                depositBtn.disabled = false;
                depositText.textContent = `Deposit ${selectedDenomination} S to Pool`;
            }
        }

        async function withdraw() {
            if (!account) {
                showAlert('error', 'Please connect your wallet first');
                return;
            }

            const recipientValue = document.getElementById('recipient').value.trim();
            if (!recipientValue) {
                showAlert('error', 'Please enter recipient address');
                return;
            }

            if (!web3.utils.isAddress(recipientValue)) {
                showAlert('error', 'Invalid recipient address');
                return;
            }

            // Get stored deposits
            const deposits = JSON.parse(localStorage.getItem('tornadoDeposits') || '[]');
            if (deposits.length === 0) {
                showAlert('error', 'No deposits found. Please deposit first.');
                return;
            }

            const withdrawBtn = document.getElementById('withdrawBtn');
            const withdrawText = document.getElementById('withdrawText');
            
            try {
                withdrawBtn.disabled = true;
                withdrawText.innerHTML = '<div class="loading"></div>Preparing withdrawal...';

                // Use first available deposit (simplified)
                const deposit = deposits[0];
                
                withdrawText.innerHTML = '<div class="loading"></div>Generating proof...';
                
                // Generate nullifier (simplified - use secret as nullifier for testnet)
                const nullifier = web3.utils.keccak256(deposit.secret);
                
                // Empty merkle proof for simplified testnet version
                const merkleProof = [];
                
                withdrawText.innerHTML = '<div class="loading"></div>Withdrawing from pool...';

                // Withdraw from contract
                const tx = await tornadoContract.methods.withdraw(
                    web3.utils.toWei(deposit.denomination.toString(), 'ether'),
                    nullifier,
                    recipientValue,
                    '0x0000000000000000000000000000000000000000', // No relayer
                    0, // No fee
                    merkleProof
                ).send({
                    from: account,
                    gas: 400000
                });

                // Remove used deposit
                deposits.shift();
                localStorage.setItem('tornadoDeposits', JSON.stringify(deposits));

                showAlert('success', `Withdrawal successful! ${deposit.denomination} S sent to ${recipientValue.slice(0,6)}...${recipientValue.slice(-4)}`);
                
                // Clear recipient
                document.getElementById('recipient').value = '';
                await loadStats();

            } catch (error) {
                console.error('Withdrawal failed:', error);
                
                let errorMsg = 'Withdrawal failed';
                if (error.code === 4001) {
                    errorMsg = 'Transaction cancelled';
                } else if (error.message?.includes('NullifierUsed')) {
                    errorMsg = 'This deposit was already withdrawn';
                } else if (error.message?.includes('InvalidProof')) {
                    errorMsg = 'Invalid withdrawal proof';
                }
                
                showAlert('error', errorMsg);
            } finally {
                withdrawBtn.disabled = false;
                withdrawText.textContent = 'Withdraw from Pool';
            }
        }

        async function loadStats() {
            try {
                const [anonymitySet, tvl, relayerFee] = await Promise.all([
                    tornadoContract.methods.getAnonymitySetSize().call(),
                    tornadoContract.methods.getTotalValueLocked().call(),
                    tornadoContract.methods.relayerFeePercent().call()
                ]);

                document.getElementById('anonymitySet').textContent = anonymitySet.toString();
                document.getElementById('totalValueLocked').textContent = parseFloat(web3.utils.fromWei(tvl, 'ether')).toFixed(1);
                document.getElementById('relayerFee').textContent = (Number(relayerFee) / 100) + '%';
            } catch (error) {
                console.log('Failed to load stats:', error);
            }
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            const addressEl = document.getElementById('walletAddress');
            const connectBtn = document.getElementById('connectBtn');
            const depositBtn = document.getElementById('depositBtn');
            const depositText = document.getElementById('depositText');

            if (account) {
                statusEl.style.display = 'flex';
                addressEl.textContent = account.slice(0, 6) + '...' + account.slice(-4);
                connectBtn.textContent = 'Connected';
                connectBtn.disabled = true;
                
                if (selectedDenomination) {
                    depositBtn.disabled = false;
                    depositText.textContent = `Deposit ${selectedDenomination} S to Pool`;
                }
            } else {
                statusEl.style.display = 'none';
                connectBtn.textContent = 'Connect Wallet';
                connectBtn.disabled = false;
                depositBtn.disabled = true;
                depositText.textContent = 'Connect Wallet to Deposit';
            }
        }

        function handleAccountsChanged(accounts) {
            if (accounts.length > 0) {
                account = accounts[0];
                updateConnectionStatus();
                loadStats();
            } else {
                account = null;
                updateConnectionStatus();
            }
        }

        function showAlert(type, message) {
            const alertsContainer = document.getElementById('alerts');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            alertsContainer.innerHTML = '';
            alertsContainer.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.remove();
                }, 6000);
            }
        }
    </script>
</body>
</html>
