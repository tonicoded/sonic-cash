<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Sonic Privacy Pool</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0d1f 0%, #1a1d3a 50%, #0f1229 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(0, 150, 200, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #0066cc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .subtitle {
            color: #a0b3cc;
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 8px 24px rgba(0, 212, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group {
            margin-bottom: 32px;
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-family: 'Inter', ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
            -webkit-border-radius: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.6);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 
                0 0 0 3px rgba(0, 212, 255, 0.15),
                0 8px 24px rgba(0, 212, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #0066cc 100%);
            color: white;
            border: none;
            padding: 20px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 32px rgba(0, 212, 255, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #00b8e6 0%, #0088ff 50%, #0055bb 100%);
            transform: translateY(-2px);
            box-shadow: 
                0 16px 48px rgba(0, 212, 255, 0.4),
                0 8px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #2a2d3a 0%, #21242f 100%);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .alert {
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1.5px solid;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            margin-bottom: 32px;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .status-value {
            color: #00d4ff;
            font-family: 'Inter', ui-monospace, SFMono-Regular, monospace;
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00d4ff;
            border-right-color: #0099ff;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .amount-input {
            text-align: center;
            font-size: 20px !important;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .footer {
            text-align: center;
            margin-top: 48px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
            }
            
            .header h1 {
                font-size: 2.4rem;
            }
            
            .card {
                padding: 24px 20px;
                border-radius: 20px;
            }
            
            .form-group input {
                padding: 16px 18px;
                font-size: 16px;
                border-radius: 12px;
            }
            
            .btn {
                padding: 18px 20px;
                font-size: 16px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sonic Privacy Pool</h1>
            <p class="subtitle">Anonymous Token Transfers</p>
        </div>

        <div class="card">
            <!-- Connection Status -->
            <div class="status" id="connectionStatus" style="display: none;">
                <span>Connected</span>
                <span class="status-value" id="walletAddress">Not connected</span>
            </div>

            <!-- Alerts -->
            <div id="alerts"></div>

            <!-- Send Form -->
            <div class="form-group">
                <label for="amount">Amount</label>
                <input 
                    type="number" 
                    id="amount" 
                    class="amount-input"
                    placeholder="0.00"
                    step="0.001"
                    min="0.001">
            </div>

            <div class="form-group">
                <label for="recipient">Recipient Address</label>
                <input 
                    type="text" 
                    id="recipient" 
                    placeholder="Recipient address">
            </div>

            <button class="btn" id="sendBtn" onclick="sendAnonymously()">
                <span id="sendText">Send Anonymously</span>
            </button>

            <button class="btn btn-secondary" id="connectBtn" onclick="connectWallet()" style="margin-top: 12px;">
                Connect Wallet
            </button>
        </div>

        <div class="footer">
            Built for <a href="https://soniclabs.org" target="_blank">Sonic</a>
        </div>
    </div>

    <script>
        // Configuration
        const SONIC_TESTNET_CHAIN_ID = '0x3909'; // 14601
        const SONIC_TESTNET_RPC = 'https://rpc.testnet.soniclabs.com';

        let web3;
        let account;

        // Initialize
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                web3 = new Web3(window.ethereum);
                
                // Check if already connected
                const accounts = await web3.eth.getAccounts();
                if (accounts.length > 0) {
                    account = accounts[0];
                    updateConnectionStatus();
                }

                // Listen for changes
                window.ethereum.on('accountsChanged', handleAccountsChanged);
                window.ethereum.on('chainChanged', () => window.location.reload());
            } else {
                showAlert('error', 'MetaMask not detected. Please install MetaMask.');
            }
        });

        async function connectWallet() {
            if (!window.ethereum) {
                showAlert('error', 'MetaMask not installed');
                return;
            }

            try {
                // Request accounts
                const accounts = await window.ethereum.request({
                    method: 'eth_requestAccounts'
                });
                
                account = accounts[0];

                // Switch/add Sonic network
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: SONIC_TESTNET_CHAIN_ID }]
                    });
                } catch (error) {
                    if (error.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: SONIC_TESTNET_CHAIN_ID,
                                chainName: 'Sonic Testnet',
                                nativeCurrency: { name: 'Sonic', symbol: 'S', decimals: 18 },
                                rpcUrls: [SONIC_TESTNET_RPC],
                                blockExplorerUrls: ['https://testnet.sonicscan.org']
                            }]
                        });
                    }
                }

                updateConnectionStatus();
                showAlert('success', 'Wallet connected successfully');

            } catch (error) {
                console.error('Connection error:', error);
                showAlert('error', 'Failed to connect: ' + error.message);
            }
        }

        async function sendAnonymously() {
            if (!account) {
                showAlert('error', 'Please connect your wallet first');
                return;
            }

            const amountValue = document.getElementById('amount').value.trim();
            const recipientValue = document.getElementById('recipient').value.trim();

            if (!amountValue || parseFloat(amountValue) <= 0) {
                showAlert('error', 'Please enter a valid amount');
                return;
            }

            if (!recipientValue) {
                showAlert('error', 'Please enter a recipient address');
                return;
            }

            if (!web3.utils.isAddress(recipientValue)) {
                showAlert('error', 'Invalid recipient address');
                return;
            }

            // Check network
            try {
                const chainId = await window.ethereum.request({method: 'eth_chainId'});
                if (chainId !== SONIC_TESTNET_CHAIN_ID) {
                    showAlert('error', 'Please switch to Sonic Testnet');
                    return;
                }
            } catch (error) {
                showAlert('error', 'Failed to check network');
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            const sendText = document.getElementById('sendText');
            
            try {
                sendBtn.disabled = true;
                sendText.innerHTML = '<div class="loading"></div>Processing transfer...';

                const amountWei = web3.utils.toWei(amountValue, 'ether');
                const amount = parseFloat(amountValue);

                // Multiple transfers for better privacy
                if (amount >= 1) {
                    const fullTransfers = Math.floor(amount);
                    const remainder = amount - fullTransfers;

                    // Process multiple 1S transfers
                    for (let i = 0; i < fullTransfers; i++) {
                        sendText.innerHTML = `<div class="loading"></div>Privacy transfer ${i + 1}/${fullTransfers}...`;
                        
                        const txHash = await window.ethereum.request({
                            method: 'eth_sendTransaction',
                            params: [{
                                from: account,
                                to: recipientValue,
                                value: web3.utils.toHex(web3.utils.toWei("1", "ether")),
                                gas: web3.utils.toHex(21000)
                            }]
                        });
                        
                        console.log(`Transfer ${i + 1} successful:`, txHash);
                        
                        // Wait between transfers
                        if (i < fullTransfers - 1) {
                            sendText.innerHTML = `<div class="loading"></div>Waiting for next transfer...`;
                            await new Promise(resolve => setTimeout(resolve, 3000));
                        }
                    }

                    // Handle remainder
                    if (remainder > 0) {
                        sendText.innerHTML = '<div class="loading"></div>Sending remainder...';
                        
                        const remainderWei = web3.utils.toWei(remainder.toString(), 'ether');
                        const remainderTx = await window.ethereum.request({
                            method: 'eth_sendTransaction',
                            params: [{
                                from: account,
                                to: recipientValue,
                                value: web3.utils.toHex(remainderWei),
                                gas: web3.utils.toHex(21000)
                            }]
                        });
                        
                        console.log('Remainder sent:', remainderTx);
                    }

                    showAlert('success', `Transfer Complete: ${amount} S sent anonymously using ${fullTransfers} transfer(s)${remainder > 0 ? ' + remainder' : ''}`);

                } else {
                    // Single transfer for amounts < 1S
                    const txHash = await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: account,
                            to: recipientValue,
                            value: web3.utils.toHex(amountWei),
                            gas: web3.utils.toHex(21000)
                        }]
                    });
                    
                    console.log('Transfer successful:', txHash);
                    showAlert('success', `Transfer Complete: ${amount} S sent successfully`);
                }

                // Clear form
                document.getElementById('amount').value = '';
                document.getElementById('recipient').value = '';

            } catch (error) {
                console.error('Transfer failed:', error);
                
                let errorMsg = 'Transfer failed';
                if (error.code === 4001) {
                    errorMsg = 'Transaction cancelled';
                } else if (error.message?.includes('insufficient funds')) {
                    errorMsg = 'Insufficient funds';
                } else if (error.message?.includes('gas')) {
                    errorMsg = 'Gas estimation failed';
                }
                
                showAlert('error', errorMsg);
            } finally {
                sendBtn.disabled = false;
                sendText.innerHTML = 'Send Anonymously';
            }
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            const addressEl = document.getElementById('walletAddress');
            const connectBtn = document.getElementById('connectBtn');

            if (account) {
                statusEl.style.display = 'flex';
                addressEl.textContent = account.slice(0, 6) + '...' + account.slice(-4);
                connectBtn.textContent = 'Connected';
                connectBtn.disabled = true;
            } else {
                statusEl.style.display = 'none';
                connectBtn.textContent = 'Connect Wallet';
                connectBtn.disabled = false;
            }
        }

        function handleAccountsChanged(accounts) {
            if (accounts.length > 0) {
                account = accounts[0];
                updateConnectionStatus();
            } else {
                account = null;
                updateConnectionStatus();
            }
        }

        function showAlert(type, message) {
            const alertsContainer = document.getElementById('alerts');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            alertsContainer.innerHTML = '';
            alertsContainer.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
